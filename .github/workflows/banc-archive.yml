name: Banc de fiabilite (archive quotidienne)
# POURQUOI : etape 2 du banc des modeles de Malta Dive Atlas. Chaque jour :
# 1) previsions des modeles candidats et observations (LMML, CALYPSO) ;
# 2) previsions Copernicus MEDSEA (17/09 : Nicolas veut le meme recul pour la
#    houle et le courant qui font la carte a temoins) et recherche d'un arbitre
#    de houle, aucun jeu de vagues CALYPSO n'etant ouvert ;
# 3) etat du banc (jours archives, trous, regle d'arret) dans data/banc/etat.md ;
# 4) verdict du banc (23/09) : scores par modele, variable, echeance et facade,
#    regle d'arret 28 j / 30 h / borne 45 j, dans data/banc/verdict.md et .json.
# Chaque etape ecrit son rapport ; le commit a lieu meme en echec, puis le job
# echoue visiblement (une session ne lit pas les logs).
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/banc_archive.py'
      - 'scripts/banc_cmems.py'
      - 'scripts/banc_hebdo.py'
      - 'scripts/banc_verdict.py'
      - '.github/workflows/banc-archive.yml'
permissions:
  contents: write
concurrency:
  group: banc-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install "copernicusmarine>=2" xarray numpy
      - name: Archiver, commiter, signaler
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: |
          set +e
          python scripts/banc_archive.py
          CODE=$?
          timeout 25m python scripts/banc_cmems.py
          [ $? -ne 0 ] && CODE=1
          python scripts/banc_hebdo.py
          python scripts/banc_verdict.py > /dev/null || { echo "::warning::banc_verdict a echoue"; CODE=1; }
          git config user.name "banc-archive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/banc
          if git diff --cached --quiet; then
            echo "Rien a commiter."
          else
            git commit -m "banc: archive $(date -u +%F) (code $CODE)"
            git pull --rebase --autostash && git push || { echo "::error::push rejete"; CODE=1; }
          fi
          exit $CODE
