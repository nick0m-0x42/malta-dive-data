name: Thermocline daily
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 05:00 CEST / 04:00 CET (Malte)
  workflow_dispatch: {}    # lancement manuel possible
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "copernicusmarine>=2" xarray numpy
      - name: Fetch thermocline profiles
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: python scripts/fetch_thermocline.py
      - name: Commit data
        run: |
          git config user.name "thermocline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "thermocline $(date -u +%F)"
          git push
